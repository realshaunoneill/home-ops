                    entity_id: input_number.washing_up_liquid_bottles
              - type: button
                name: Add one
                icon: mdi:plus
                tap_action:
                  action: call-service
                  service: input_number.increment
                  target:
                    entity_id: input_number.washing_up_liquid_bottles

      - type: vertical-stack
