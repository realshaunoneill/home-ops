version: "3.8"

services:
  dd-agent:
    image: gcr.io/datadoghq/agent:7
    container_name: dd-agent
    restart: unless-stopped
    environment:
      - TZ=Europe/Dublin
      - DD_API_KEY=${DD_API_KEY}
      # EU1, not US1 — the shaunoneill7@gmail.com org is on datadoghq.eu. An API
      # key is scoped to one site, so DD_SITE and DD_API_KEY must be changed
      # together; a US1 key against .eu (or vice versa) fails closed as 403
      # Forbidden and the agent ships nothing while still looking healthy.
      - DD_SITE=datadoghq.eu
      - DD_PROCESS_AGENT_ENABLED=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /etc/passwd:/etc/passwd:ro
