version: "3.8"

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.3-nightly
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=99
      - PGID=100
      - TZ=Europe/Dublin
    volumes:
      - /mnt/user/shared/services/prowlarr/data:/config
    ports:
      - "9696:9696"
