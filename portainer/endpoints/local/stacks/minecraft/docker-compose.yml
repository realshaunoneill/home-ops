services:
  mc:
    # itzg publishes dated releases (2026.7.2) plus a rolling `latest`; keep the
    # explicit -java25 variant so a future default JRE bump isn't silent.
    image: itzg/minecraft-server:2026.7.2-java25
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "25575:25575"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      MEMORY: "1536M"
      USE_AIKAR_FLAGS: "true"
      USE_MEOWICE_FLAGS: "true"
      FORCE_GAMEMODE: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      VIEW_DISTANCE: "6"
    volumes:
      - "/opt/minecraft/data:/data"
