version: "3.8"

# Homelable — self-hosted visual homelab mapper (https://homelable.net,
# github.com/Pouzor/homelable, MIT). Interactive canvas of the LAN with live
# status checks, plus importers for Proxmox / Zigbee2MQTT / Z-Wave JS.
#
# Three images, all published to ghcr with plain semver tags. They share one
# version and MUST be bumped together — renovate.json groups them for that
# reason. Do not let them drift apart; the frontend talks to a versioned API.

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI + the nmap scanner and status checker.
  #
  # network_mode: host is deliberate and is the whole reason this stack is not
  # a copy of upstream's compose. The scanner reads MAC addresses from ARP,
  # which is layer 2: from a Docker bridge every LAN host is one hop away
  # behind the gateway, so the MAC field stays permanently empty (cap_add
  # NET_RAW grants raw sockets, not a place on the LAN). Without MACs devices
  # are matched on IP alone, so a DHCP lease change re-adds a device as a new
  # inventory entry instead of updating the existing one.
  #
  # Consequences of host networking, both handled below:
  #   - no `ports:` mapping; it binds 0.0.0.0:8000 on 192.168.0.20 directly,
  #     reachable from the whole LAN with no Traefik in front (its own auth is
  #     the only gate — hence the hard-fail on an unset AUTH_PASSWORD_HASH).
  #   - `backend:8000` service DNS no longer resolves, so frontend and mcp
  #     must address it as 192.168.0.20:8000. See the inline nginx config.
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/pouzor/homelable-backend:3.3.5
    container_name: homelable-backend
    restart: unless-stopped
    network_mode: host
    cap_add:
      # nmap needs raw sockets for ARP/SYN scanning.
      - NET_RAW

    # Pin the resolver. Inheriting the host's resolv.conf makes every hostname
    # status check flap: cevo's systemd-resolved upstreams are
    # `192.168.0.10 192.168.0.5 8.8.8.8`, and the first two are both broken —
    # unraid REFUSES :53, and 192.168.0.5 does not exist at all (no ping, absent
    # from the LAN scan), so it black-holes. Every lookup walks that list before
    # reaching 8.8.8.8: measured 1 failure in 20 with a worst case of 11.9s,
    # against a 5s timeout in the status checker. Result was all 20 https-checked
    # services flapping red while curl from the same host worked fine.
    # AdGuard (on this host) first, Cloudflare as backstop — the same reasoning as
    # the lego resolver pinning in the traefik stack. `dns:` is honoured under
    # network_mode: host (verified: it rewrites the container's resolv.conf).
    # The underlying host resolver list is still wrong and worth fixing separately.
    dns:
      - 192.168.0.20
      - 1.1.1.1

    # Pinning the resolver alone was not enough — it fixed the dead upstreams but
    # the status checker still flapped, and for a second, unrelated reason.
    # AdGuard runs `ratelimit: 20` (queries/sec/client). One check cycle resolves
    # ~20 hostnames at once, and glibc fires A and AAAA in parallel, so a single
    # cycle bursts ~40 queries and AdGuard silently drops the excess. glibc's
    # default is `timeout:5 attempts:2`, so a dropped query stalls the whole
    # lookup for a full 5s before retrying — just over the checker's 5s budget.
    # Measured on the deployed container, 19 concurrent getaddrinfo calls:
    #   default                             max 5.02s  avg 2.38s  -> 10/19 flap
    #   single-request only                 max 5.03s  avg 2.91s  -> no better
    #   timeout:1 attempts:5                max 3.01s  avg 0.95s
    #   + single-request (this)             max 1.03s  avg 0.80s
    # single-request serialises A/AAAA, halving the burst; timeout:1 makes a
    # dropped query cost 1s instead of 5. Note raw TCP to :443 was never the
    # problem — it measured 0.01s for the same 19 connections.
    # The real root cause is AdGuard's ratelimit being too low for its own
    # Docker host; whitelisting it there would fix this network-wide.
    dns_opt:
      - single-request
      - timeout:1
      - attempts:5
    environment:
      - TZ=Europe/Dublin

      # SQLite DB + uploaded floor plans, both on the host path volume below.
      - SQLITE_PATH=/app/data/homelab.db
      - UPLOAD_DIR=/app/data/uploads

      # Browser origins allowed to call the API. This must list every URL the
      # app is actually opened on — a missing entry fails the SPA's fetches
      # with a CORS error while the API itself looks healthy.
      - CORS_ORIGINS=["https://homelable.home.shaunoneill.com","http://192.168.0.20:3002"]

      # Secrets — set on the stack's Environment variables in Portainer, never
      # here. The `:?` guards make a missing value fail the deploy instead of
      # silently starting with weak/no auth on a LAN-exposed port; that matters
      # because the API redeploy endpoint is known to wipe stored stack env
      # (see CLAUDE.md → Secrets) and this service has no Traefik in front.
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY on the homelable stack env in Portainer}
      - AUTH_MODE=local
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      # bcrypt hashes contain `$`, which the Portainer env panel interpolates —
      # store the value with every `$` doubled ($$2b$$12$$...), exactly as
      # wireguard's PASSWORD_HASH does. See .env.example.
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:?set AUTH_PASSWORD_HASH on the homelable stack env in Portainer}

      # Shared secret for mcp -> backend. Must match the mcp service below.
      - MCP_SERVICE_KEY=${MCP_SERVICE_KEY:?set MCP_SERVICE_KEY on the homelable stack env in Portainer}

      # The LAN. Deep-scan port probing is left off; it is overridable per-scan
      # from the scan dialog anyway.
      - SCANNER_RANGES=["192.168.0.0/24"]
      - STATUS_CHECKER_INTERVAL=60

      # Optional importers (Proxmox 192.168.0.200, Zigbee2MQTT / Z-Wave JS via
      # the Home Assistant broker on 192.168.0.245) each need their own
      # credential and are off until configured — see .env.example for the full
      # variable list. One-off imports can pass credentials in the UI dialog
      # instead, which keeps them out of the stack env entirely.
    volumes:
      # Host path, not a named volume: matches the /opt/... convention for
      # local stacks and keeps the DB findable for backups. The image runs as
      # root, so no ownership setup is needed.
      - /opt/homelable/data:/app/data

  # ---------------------------------------------------------------------------
  # Frontend — React SPA behind nginx, proxying /api and the websocket.
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/pouzor/homelable-frontend:3.3.5
    container_name: homelable-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TZ=Europe/Dublin

    # The shipped nginx.conf proxies to `backend:8000`, which cannot resolve
    # now that the backend is on host networking — so it is replaced wholesale
    # via an inline config. Inline `configs:` is the pattern used by traefik
    # and grafana here: self-contained, versioned, survives redeploys, and
    # needs no relative-path-volume support.
    #
    # Two gotchas, both documented in CLAUDE.md:
    #   - Compose interpolates `${...}` in configs.content, so every literal
    #     nginx `$` is doubled to `$$` below.
    #   - A change to this content may not recreate the container on "Pull and
    #     redeploy". If an edit here has no effect, force it on the host:
    #     docker compose -p homelable up -d --force-recreate frontend
    configs:
      - source: homelable_nginx
        target: /etc/nginx/conf.d/default.conf

    ports:
      # Direct access at http://192.168.0.20:3002 — bypasses Traefik for
      # debugging. Upstream's 3000 is taken on this host by AdGuard's web UI.
      - "3002:80"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.homelable.rule=Host(`homelable.home.shaunoneill.com`)"
      - "traefik.http.routers.homelable.entrypoints=websecure"
      - "traefik.http.routers.homelable.tls.certresolver=myresolver"
      # default-chain (compress + security headers) is defined in the traefik
      # stack's inline dynamic config; @file qualifies the cross-provider ref.
      - "traefik.http.routers.homelable.middlewares=default-chain@file"
      - "traefik.http.services.homelable.loadbalancer.server.port=80"

    networks:
      - proxy
      - default

  # ---------------------------------------------------------------------------
  # MCP server — exposes the canvas to AI clients (Claude Code et al).
  # Authenticates clients with MCP_API_KEY and itself to the backend with
  # MCP_SERVICE_KEY.
  # ---------------------------------------------------------------------------
  mcp:
    image: ghcr.io/pouzor/homelable-mcp:3.3.5
    container_name: homelable-mcp
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - TZ=Europe/Dublin
      # Host-networked backend — not reachable as backend:8000. Keep in sync
      # with the proxy_pass targets in the inline nginx config above.
      - BACKEND_URL=http://192.168.0.20:8000
      - MCP_API_KEY=${MCP_API_KEY:?set MCP_API_KEY on the homelable stack env in Portainer}
      - MCP_SERVICE_KEY=${MCP_SERVICE_KEY:?set MCP_SERVICE_KEY on the homelable stack env in Portainer}

    ports:
      # Direct access at http://192.168.0.20:8001.
      - "8001:8001"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.homelable-mcp.rule=Host(`homelable-mcp.home.shaunoneill.com`)"
      - "traefik.http.routers.homelable-mcp.entrypoints=websecure"
      - "traefik.http.routers.homelable-mcp.tls.certresolver=myresolver"
      # default-secure-headers, NOT default-chain: the chain adds compress,
      # and gzip buffering breaks MCP's streamed responses. Same reasoning as
      # plex/immich/paperless in the traefik stack.
      - "traefik.http.routers.homelable-mcp.middlewares=default-secure-headers@file"
      - "traefik.http.services.homelable-mcp.loadbalancer.server.port=8001"

    networks:
      - proxy
      - default

configs:
  # Replaces the image's /etc/nginx/conf.d/default.conf. Kept as close to
  # upstream docker/nginx.conf as possible; the deltas are the host-networked
  # backend address, client_max_body_size, and the websocket read timeout.
  homelable_nginx:
    content: |
      server {
          listen 80;
          server_name _;
          root /usr/share/nginx/html;
          index index.html;

          # Floor-plan uploads. nginx defaults to 1m, which 413s a phone
          # photo. Traefik's websecure readTimeout (600s) covers the
          # slow-upload half of the same problem.
          client_max_body_size 50m;

          # Websocket — must stay above /api/ to win the location match.
          location /api/v1/status/ws/ {
              proxy_pass http://192.168.0.20:8000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
              # Default is 60s, which would drop the idle live-status socket.
              proxy_read_timeout 3600s;
          }

          location /api/ {
              proxy_pass http://192.168.0.20:8000;
              proxy_set_header Host $$host;
              proxy_set_header X-Real-IP $$remote_addr;
          }

          # Legacy websocket path.
          location /ws/ {
              proxy_pass http://192.168.0.20:8000;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $$host;
              proxy_read_timeout 3600s;
          }

          # SPA fallback.
          location / {
              try_files $$uri $$uri/ /index.html;
          }
      }

networks:
  proxy:
    external: true
