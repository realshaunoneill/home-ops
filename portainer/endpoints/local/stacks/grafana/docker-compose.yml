version: "3.8"

services:
  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    restart: unless-stopped

    environment:
      - TZ=Europe/Dublin

      # Admin bootstrap — set in Portainer stack env (do NOT commit).
      # If unset on first boot, Grafana defaults to admin/admin.
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}

      # Correct external URL so share links / redirects work behind Traefik.
      - GF_SERVER_ROOT_URL=https://grafana.home.shaunoneill.com
      - GF_SERVER_DOMAIN=grafana.home.shaunoneill.com

      # Local convenience: keep self-signup off, but allow anonymous
      # read-only dashboard access (no login prompt).
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=30s

      # Kill telemetry / update pings.
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_FEEDBACK_LINKS_ENABLED=false

    volumes:
      # Persist sqlite DB, plugins, and any UI-created dashboards across
      # redeploys. Directory must be owned by UID 472 (grafana) on the host:
      #   sudo mkdir -p /opt/grafana/data && sudo chown -R 472:472 /opt/grafana
      - /opt/grafana/data:/var/lib/grafana
      # Versioned dashboards from ./dashboards/*.json. Relative-path bind
      # mounts require the stack to have been created with "Enable relative
      # path volumes" turned on (SupportRelativePath=true, FilesystemPath=
      # /opt/grafana/repo). See the gatus stack for the same pattern.
      - ./dashboards:/etc/grafana/dashboards:ro

    # Inline provisioning — versioned in git. Add datasources / dashboards
    # here and pull-and-redeploy; Grafana picks them up on start. Uses the
    # same inline `configs:` pattern as the traefik stack (self-contained,
    # survives redeploys, no relative-path bind mounts).
    configs:
      - source: gf_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: gf_dashboards_provider
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
      - source: gf_unifi_alert_rules
        target: /etc/grafana/provisioning/alerting/unifi-alert-rules.yml

    ports:
      # Direct access at http://<host>:3300 — bypasses Traefik for debugging.
      # Host :3000 is taken by AdGuard's web UI, :3001 by an unmanaged
      # express-api container.
      - "3300:3000"

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.grafana.rule=Host(`grafana.home.shaunoneill.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=myresolver"
      # default-chain (compress + security headers) is defined in the traefik
      # stack's inline dynamic config; @file qualifies the cross-provider ref.
      - "traefik.http.routers.grafana.middlewares=default-chain@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

    networks:
      - proxy
      - default

  loki:
    image: grafana/loki:3.1.1
    container_name: loki
    restart: unless-stopped

    environment:
      - TZ=Europe/Dublin

    command:
      - "-config.file=/etc/loki/loki-config.yml"

    volumes:
      # Persist log chunks and indexes across redeploys.
      # Named volume avoids host-path permission drift on redeploy.
      - loki_data:/loki

    configs:
      - source: loki_config
        target: /etc/loki/loki-config.yml

    ports:
      # Direct API access at http://<host>:3100 for debugging/health checks.
      - "3100:3100"

    networks:
      - default

  promtail:
    image: grafana/promtail:3.1.1
    container_name: promtail
    restart: unless-stopped

    environment:
      - TZ=Europe/Dublin

    command:
      - "-config.file=/etc/promtail/promtail.yml"

    depends_on:
      - loki

    configs:
      - source: promtail_config
        target: /etc/promtail/promtail.yml

    ports:
      # UniFi remote syslog target -> <gateway-ip-of-this-host>:1514
      - "1514:1514/udp"
      # Promtail metrics/health endpoint.
      - "9080:9080"

    networks:
      - default

networks:
  proxy:
    external: true

volumes:
  loki_data:

configs:
  # Datasource provisioning — Prometheus lives on the same docker `proxy`
  # network, so Grafana reaches it by container name. Edit this block and
  # pull-and-redeploy to add more sources.
  # https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources
  gf_datasources:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          uid: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: false
          jsonData:
            timeInterval: 30s
            httpMethod: POST

        # Loki logs from this stack (including UniFi syslog via promtail).
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki:3100
          editable: false
          jsonData:
            maxLines: 1000

  # Dashboard provider — Grafana watches /etc/grafana/dashboards/*.json and
  # imports/updates them on start (and every 30s if allowUiUpdates=false).
  # https://grafana.com/docs/grafana/latest/administration/provisioning/#dashboards
  gf_dashboards_provider:
    content: |
      apiVersion: 1
      providers:
        - name: home-ops
          orgId: 1
          folder: home-ops
          type: file
          disableDeletion: false
          allowUiUpdates: true
          updateIntervalSeconds: 30
          options:
            path: /etc/grafana/dashboards
            foldersFromFilesStructure: false

  # Grafana Alerting provisioning for UniFi log spikes in Loki.
  # https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
  gf_unifi_alert_rules:
    content: |
      apiVersion: 1
      groups:
        - orgId: 1
          name: unifi-log-alerts
          folder: home-ops
          interval: 1m
          rules:
            - uid: unifi-high-severity-spike
              title: UniFi High-Severity Log Spike
              condition: C
              data:
                - refId: A
                  queryType: instant
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: loki
                  model:
                    datasource:
                      type: loki
                      uid: loki
                    editorMode: code
                    expr: sum(count_over_time({job="unifi-syslog",severity=~"warning|err|crit|alert|emerg"}[5m]))
                    instant: true
                    intervalMs: 1000
                    maxDataPoints: 43200
                    queryType: instant
                    refId: A
                - refId: C
                  queryType: ""
                  relativeTimeRange:
                    from: 0
                    to: 0
                  datasourceUid: __expr__
                  model:
                    conditions:
                      - evaluator:
                          params:
                            - 25
                          type: gt
                        operator:
                          type: and
                        query:
                          params:
                            - A
                        reducer:
                          params: []
                          type: last
                        type: query
                    datasource:
                      type: __expr__
                      uid: __expr__
                    expression: A
                    intervalMs: 1000
                    maxDataPoints: 43200
                    refId: C
                    type: threshold
              noDataState: OK
              execErrState: Error
              for: 10m
              annotations:
                summary: UniFi high-severity log spike
                description: More than 25 warning-or-higher UniFi syslog events in 5 minutes for at least 10 minutes.
              labels:
                severity: warning
                source: unifi
              isPaused: false

  loki_config:
    content: |
      auth_enabled: false

      server:
        http_listen_port: 3100

      common:
        path_prefix: /loki
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      schema_config:
        configs:
          - from: 2024-01-01
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      storage_config:
        tsdb_shipper:
          active_index_directory: /loki/index
          cache_location: /loki/index_cache
        filesystem:
          directory: /loki/chunks

      compactor:
        working_directory: /loki/compactor
        compaction_interval: 10m
        retention_enabled: true
        delete_request_store: filesystem

      limits_config:
        retention_period: 30d

      analytics:
        reporting_enabled: false

  promtail_config:
    content: |
      server:
        http_listen_port: 9080
        grpc_listen_port: 0

      positions:
        filename: /tmp/positions.yaml

      clients:
        - url: http://loki:3100/loki/api/v1/push

      scrape_configs:
        # UniFi Activity Logging (SIEM Server) sends syslog to this UDP
        # listener.
        - job_name: unifi_syslog_udp
          syslog:
            listen_address: 0.0.0.0:1514
            listen_protocol: udp
            idle_timeout: 60s
            label_structured_data: true
            labels:
              job: unifi-syslog
              source: unifi
          relabel_configs:
            - source_labels: [__syslog_message_hostname]
              target_label: host
            - source_labels: [__syslog_message_severity]
              target_label: severity
            - source_labels: [__syslog_message_facility]
              target_label: facility
            - source_labels: [__syslog_message_app_name]
              target_label: app
