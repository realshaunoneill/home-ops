metrics: true

# Gatus monitoring config - versioned in git, read on container boot.
# Docs: https://github.com/TwiN/gatus
#
# Endpoints are probed through their public Traefik hostnames so each check
# also validates routing + TLS. Hosts that are not 200-on-root (dashboards that
# redirect or require auth) use a < 400 condition instead of == 200.
#
# EVERY endpoint starts with `[CONNECTED] == true`, and this is load-bearing.
# `[STATUS] < 400` is TRUE when the request never completed, because a failed
# probe reports status 0 — so on its own it passes when a service is entirely
# unreachable. That silently masked real failures on 12 of these endpoints
# (13-26 dead probes each recorded as successes) while only the three that
# happened to carry a [CERTIFICATE_EXPIRATION] condition ever alerted, since
# a dead connection reads 0s of remaining cert validity. The result was a
# monitor that was noisy about three services and blind about the rest.
# Never write a bare `[STATUS] < 400` condition here.
#
# CERTIFICATE_EXPIRATION is on every https endpoint on purpose: Traefik renews
# at 30 days remaining, so a 7-day threshold only fires when renewal itself is
# broken. That failure is otherwise invisible — a stale _acme-challenge TXT
# blocks all issuance while existing certs keep serving from cache.

storage:
  type: sqlite
  path: /data/data.db

alerting:
  pushover:
    application-token: ${GATUS_PUSHOVER_APPLICATION_TOKEN}
    user-key: ${GATUS_PUSHOVER_USER_KEY}
    # Optional: target a specific Pushover device
    # device: ${GATUS_PUSHOVER_DEVICE}
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      minimum-reminder-interval: 30m
      send-on-resolved: true
      description: service health check failed

endpoints:
  # --- Media ---
  - name: plex
    group: media
    url: https://plex.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: tautulli
    group: media
    url: https://tautulli.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: radarr
    group: media
    url: https://radarr.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: sonarr
    group: media
    url: https://sonarr.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: bazarr
    group: media
    url: https://bazarr.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: prowlarr
    group: media
    url: https://prowlarr.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: nzbget
    group: media
    url: https://nzbget.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  # --- Apps & automation ---
  - name: n8n
    group: apps
    url: https://n8n.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: home-assistant
    group: apps
    url: https://home.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: homelable
    group: apps
    url: https://homelable.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: homelable-backend
    group: apps
    # Checked separately from the SPA above: the backend runs on host
    # networking, so a frontend 200 only proves nginx is up, not that the API
    # behind it is. Hit the LAN address directly, the same one the frontend's
    # nginx proxies to. Plain http by IP, so no cert condition applies.
    url: http://192.168.0.20:8000/api/v1/health
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  # --- Infrastructure ---
  - name: traefik-dashboard
    group: infra
    url: https://traefik.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: proxmox
    group: infra
    url: https://proxmox.home.shaunoneill.com
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: wireguard-ui
    group: infra
    url: https://wireguard.home.shaunoneill.com
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: adguard
    group: infra
    url: https://adguard.home.shaunoneill.com
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: cloudflared
    group: infra
    # Checks the local connector metrics endpoint directly over docker DNS.
    # This validates the tunnel connector process itself. Plain http over a
    # container alias, so no cert condition applies.
    url: http://cloudflared:2000/metrics
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: unraid
    group: infra
    url: https://unraid.home.shaunoneill.com
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  # Every other check here is LAN-internal, so a total WAN outage would show up
  # as 22 green endpoints and no alert. This is the only thing watching the
  # internet itself. Queried straight at 1.1.1.1 (not AdGuard) so it tests the
  # WAN path rather than local resolution.
  #
  # one.one.one.one is deliberate: TTL ~71000s at both public resolvers, so it
  # is effectively always cached and the probe never depends on a third party's
  # authoritative servers. Do NOT use ui.com here — 60s TTL, which is what makes
  # UniFi's own WAN monitors so flappy (see CLAUDE.md "WAN health monitoring").
  #
  # Known limit: the gateway's false WAN-down blackholes last ~15s, so this
  # 30s/3-failure check will NOT catch them. The gateway log is the detector for
  # those. This exists to catch genuine multi-minute outages.
  - name: internet
    group: infra
    url: "1.1.1.1"
    interval: 30s
    dns:
      query-name: "one.one.one.one"
      query-type: "A"
    conditions:
      - "[CONNECTED] == true"
      # No [BODY] assertion: one.one.one.one answers 1.1.1.1 AND 1.0.0.1, and
      # which one lands in BODY is not stable. RCODE is the real signal.
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: pushover

  # --- Failover pair on unraid (see CLAUDE.md "cevo failover") ---
  # These exist so the warm spare cannot rot unnoticed: a backup you only
  # discover is broken during an outage is worse than none.
  #
  # DNS checks, not web-UI checks. The adguard endpoint above only proves the
  # admin UI answers, which says nothing about whether it is resolving — and
  # resolution is the entire job. Each asserts the ANSWER, so a wrong rewrite
  # target is caught too, not just a dead server.
  - name: adguard-dns-primary
    group: failover
    url: "192.168.0.20"
    interval: 120s
    dns:
      query-name: "radarr.home.shaunoneill.com"
      query-type: "A"
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"
      # Primary must point at cevo's traefik.
      - "[BODY] == 192.168.0.20"
    alerts:
      - type: pushover

  - name: adguard-dns-backup
    group: failover
    url: "192.168.0.12"
    interval: 120s
    dns:
      query-name: "radarr.home.shaunoneill.com"
      query-type: "A"
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"
      # Backup must point at the unraid traefik, or failover is silently broken.
      - "[BODY] == 192.168.0.11"
    alerts:
      - type: pushover

  # adguard-dns-primary above only asserts a REWRITE, which AdGuard answers out
  # of its own config without ever touching an upstream — so it stays green even
  # if upstream resolution is completely dead. This check queries a pass-through
  # name instead, which forces a real upstream lookup, and is the only thing
  # covering the primary's upstreams. Both instances now carry two DoH upstreams
  # plus a plain-DNS fallback_dns; before that they had a single Quad9 DoH and one
  # hiccup meant SERVFAIL for the whole network.
  - name: adguard-dns-primary-upstream
    group: failover
    url: "192.168.0.20"
    interval: 300s
    dns:
      query-name: "local.home.shaunoneill.com"
      query-type: "A"
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"
      # Must NOT be rewritten to a LAN address.
      - "[BODY] != 192.168.0.11"
      - "[BODY] != 192.168.0.20"
    alerts:
      - type: pushover

  # The WAN-IP pass-through exceptions must survive on the backup too, or
  # WireGuard and Minecraft break during a failover.
  - name: adguard-dns-backup-wan-exception
    group: failover
    url: "192.168.0.12"
    interval: 300s
    dns:
      query-name: "local.home.shaunoneill.com"
      query-type: "A"
    conditions:
      - "[CONNECTED] == true"
      - "[DNS_RCODE] == NOERROR"
      # Must NOT be rewritten to a LAN address.
      - "[BODY] != 192.168.0.11"
      - "[BODY] != 192.168.0.20"
    alerts:
      - type: pushover

  - name: traefik-backup
    group: failover
    # Hit the spare Traefik's own API directly by IP: going through a hostname
    # would resolve to cevo and prove nothing about this instance.
    url: http://192.168.0.11:8080/api/overview
    interval: 120s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"
    alerts:
      - type: pushover

  # Proves the spare can actually serve a site end-to-end, including the synced
  # wildcard cert — which expires and is refreshed by cron, so it can go stale.
  - name: traefik-backup-serving
    group: failover
    url: https://192.168.0.11
    interval: 300s
    headers:
      Host: radarr.home.shaunoneill.com
    client:
      insecure: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
    alerts:
      - type: pushover
