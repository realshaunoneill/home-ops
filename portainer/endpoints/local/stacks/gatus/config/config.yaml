metrics: true

# Gatus monitoring config - versioned in git, read on container boot.
# Docs: https://github.com/TwiN/gatus
#
# Endpoints are probed through their public Traefik hostnames so each check
# also validates routing + TLS. Hosts that are not 200-on-root (dashboards that
# redirect or require auth) use a < 400 condition instead of == 200.

storage:
  type: sqlite
  path: /data/data.db

alerting:
  pushover:
    application-token: ${GATUS_PUSHOVER_APPLICATION_TOKEN}
    user-key: ${GATUS_PUSHOVER_USER_KEY}
    # Optional: target a specific Pushover device
    # device: ${GATUS_PUSHOVER_DEVICE}
    default-alert:
      failure-threshold: 3
      success-threshold: 2
      minimum-reminder-interval: 30m
      send-on-resolved: true
      description: service health check failed

endpoints:
  # --- Media ---
  - name: plex
    group: media
    url: https://plex.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: tautulli
    group: media
    url: https://tautulli.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: radarr
    group: media
    url: https://radarr.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: sonarr
    group: media
    url: https://sonarr.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: bazarr
    group: media
    url: https://bazarr.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: prowlarr
    group: media
    url: https://prowlarr.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: nzbget
    group: media
    url: https://nzbget.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  # --- Apps & automation ---
  - name: n8n
    group: apps
    url: https://n8n.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: home-assistant
    group: apps
    url: https://home.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: homelable
    group: apps
    url: https://homelable.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[STATUS] < 400"
      - "[CERTIFICATE_EXPIRATION] > 168h"
    alerts:
      - type: pushover

  - name: homelable-backend
    group: apps
    # Checked separately from the SPA above: the backend runs on host
    # networking, so a frontend 200 only proves nginx is up, not that the API
    # behind it is. Hit the LAN address directly, the same one the frontend's
    # nginx proxies to.
    url: http://192.168.0.20:8000/api/v1/health
    interval: 60s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  # --- Infrastructure ---
  - name: traefik-dashboard
    group: infra
    url: https://traefik.home.shaunoneill.com
    interval: 60s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: proxmox
    group: infra
    url: https://proxmox.home.shaunoneill.com
    interval: 120s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: wireguard-ui
    group: infra
    url: https://wireguard.home.shaunoneill.com
    interval: 120s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: adguard
    group: infra
    url: https://adguard.home.shaunoneill.com
    interval: 120s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: cloudflared
    group: infra
    # Checks the local connector metrics endpoint directly over docker DNS.
    # This validates the tunnel connector process itself.
    url: http://cloudflared:2000/metrics
    interval: 120s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover

  - name: unraid
    group: infra
    url: https://unraid.home.shaunoneill.com
    interval: 120s
    conditions:
      - "[STATUS] < 400"
    alerts:
      - type: pushover
